name: Kiro Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Get changed files
        run: bash .github/scripts/get-changed-files.sh "${{ github.event_name }}" "${{ github.base_ref }}"

      - name: Generate diff for review
        run: bash .github/scripts/generate-diff.sh "${{ github.event_name }}" "${{ github.base_ref }}"

      - name: Run Kiro security review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: bash .github/scripts/run-kiro-review.sh

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: |
            review-report.md
            findings.json
          retention-days: 30

      - name: Comment on PR with security findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/pr-comment.js');
            await script({ github, context });

      - name: Post inline review comments on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/pr-inline-comments.js');
            await script({ github, context });

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Enrich findings and upload to S3
        if: always()
        env:
          S3_BUCKET: ${{ secrets.SECURITY_FINDINGS_BUCKET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: bash .github/scripts/enrich-and-upload.sh

      - name: Check for security failures
        run: bash .github/scripts/check-results.sh
