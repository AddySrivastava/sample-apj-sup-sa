name: Kiro Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro security review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          kiro-cli chat \
              --agent security-reviewer \
              --no-interactive \
              "Perform a comprehensive security review of all files in this repository. Check for hardcoded secrets, injection vulnerabilities, authentication issues, insecure configurations, and dependency risks. Output a markdown report to review-report.md with findings categorized by severity. At the end of the report, add a line that says exactly 'RESULT: PASS' if no critical or warning issues were found, or 'RESULT: FAIL' if any critical or warning issues were found."

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: review-report.md
          retention-days: 30

      - name: Check for security failures
        run: |
          if [ ! -f review-report.md ]; then
            echo "❌ No review report generated — treating as failure"
            exit 1
          fi
          if grep -q "RESULT: FAIL" review-report.md; then
            echo "❌ Security review found critical or warning issues:"
            echo ""
            cat review-report.md
            exit 1
          fi
          echo "✅ Security review passed — no critical or warning issues found"
