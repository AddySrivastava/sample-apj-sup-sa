name: Kiro Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro security review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          PROMPT=$(cat .kiro/agents/security-review-prompt.md)
          kiro-cli chat \
              --agent security-reviewer \
              --no-interactive \
              "$PROMPT"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: |
            review-report.md
            findings.json
          retention-days: 30

      - name: Comment on PR with security findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let reportBody = '## 🔒 Kiro Security Review\n\n';

            // Read the markdown report if it exists
            if (fs.existsSync('review-report.md')) {
              const report = fs.readFileSync('review-report.md', 'utf8');
              reportBody += report;
            } else {
              reportBody += '⚠️ Security review did not produce a report.\n';
            }

            // Add findings summary from JSON if available
            if (fs.existsSync('findings.json')) {
              try {
                const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
                const critical = findings.filter(f => f.severity === 'critical').length;
                const warning = findings.filter(f => f.severity === 'warning').length;
                const info = findings.filter(f => f.severity === 'info').length;

                reportBody += '\n\n---\n';
                reportBody += `### Summary: ${findings.length} findings\n`;
                reportBody += `| Severity | Count |\n|----------|-------|\n`;
                reportBody += `| 🔴 Critical | ${critical} |\n`;
                reportBody += `| 🟡 Warning | ${warning} |\n`;
                reportBody += `| 🔵 Info | ${info} |\n`;

                if (critical > 0 || warning > 0) {
                  reportBody += '\n❌ **This PR has security issues that must be resolved before merging.**\n';
                } else {
                  reportBody += '\n✅ **No critical or warning security issues found.**\n';
                }
              } catch (e) {
                reportBody += '\n\n_Could not parse findings.json_\n';
              }
            }

            reportBody += `\n\n_Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('## 🔒 Kiro Security Review'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: reportBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reportBody,
              });
            }

      - name: Post inline review comments on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('findings.json')) {
              console.log('No findings.json — skipping inline comments');
              return;
            }

            let findings;
            try {
              findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse findings.json:', e.message);
              return;
            }

            if (findings.length === 0) {
              console.log('No findings to comment on');
              return;
            }

            // Get the list of files changed in this PR
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changedFiles = new Set(prFiles.map(f => f.filename));

            // Build review comments only for files in the PR diff
            const comments = [];
            const severityEmoji = { critical: '🔴', warning: '🟡', info: '🔵' };

            for (const finding of findings) {
              // Only comment on files that are part of this PR
              if (!changedFiles.has(finding.file)) continue;

              const emoji = severityEmoji[finding.severity] || '⚪';
              const body = [
                `${emoji} **${finding.severity.toUpperCase()}**: ${finding.issue_type.replace(/_/g, ' ')}`,
                '',
                finding.summary,
                '',
                `**Remediation:** ${finding.remediation}`,
              ].join('\n');

              comments.push({
                path: finding.file,
                line: finding.line_end || finding.line_start,
                body: body,
              });
            }

            if (comments.length === 0) {
              console.log('No findings match files in this PR');
              return;
            }

            // Submit as a PR review with inline comments
            const reviewEvent = comments.some(c => c.body.includes('CRITICAL'))
              ? 'REQUEST_CHANGES'
              : 'COMMENT';

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: context.sha,
                event: reviewEvent,
                body: `🔒 **Kiro Security Review** found ${comments.length} issue(s) in changed files.`,
                comments: comments,
              });
              console.log(`Posted ${comments.length} inline comments`);
            } catch (e) {
              // If review fails (e.g., line not in diff), fall back to individual comments
              console.log('Review submission failed, posting individual comments:', e.message);
              for (const comment of comments) {
                try {
                  await github.rest.pulls.createReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    commit_id: context.sha,
                    path: comment.path,
                    line: comment.line,
                    body: comment.body,
                  });
                } catch (innerErr) {
                  console.log(`Could not comment on ${comment.path}:${comment.line} — ${innerErr.message}`);
                }
              }
            }

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Enrich findings and upload to S3
        if: always()
        env:
          S3_BUCKET: ${{ secrets.SECURITY_FINDINGS_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Gather git metadata
          COMMIT_ID="${{ github.sha }}"
          SHORT_COMMIT="${COMMIT_ID:0:7}"
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          AUTHOR="${{ github.actor }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # If findings.json doesn't exist, create empty array
          if [ ! -f findings.json ]; then
            echo "[]" > findings.json
          fi

          # Enrich each finding with git metadata using jq
          jq --arg commit_id "$COMMIT_ID" \
             --arg short_commit "$SHORT_COMMIT" \
             --arg branch "$BRANCH" \
             --arg repo "$REPO" \
             --arg author "$AUTHOR" \
             --arg date "$DATE" \
             --arg pr_number "$PR_NUMBER" \
             --arg pr_url "$PR_URL" \
             --arg run_id "$RUN_ID" \
             --arg run_url "$RUN_URL" \
             '[.[] | . + {
               commit_id: $commit_id,
               short_commit: $short_commit,
               branch: $branch,
               repository: $repo,
               author: $author,
               scan_date: $date,
               pull_request_number: $pr_number,
               pull_request_url: $pr_url,
               run_id: $run_id,
               run_url: $run_url
             }]' findings.json > enriched-findings.json

          # Determine S3 path: partition by date for efficient QuickSight queries
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          DAY=$(date -u +"%d")
          S3_KEY="security-findings/year=${YEAR}/month=${MONTH}/day=${DAY}/${REPO//\//-}_${SHORT_COMMIT}_${RUN_ID}.json"

          # Upload to S3 as newline-delimited JSON (for Athena/QuickSight compatibility)
          jq -c '.[]' enriched-findings.json > findings-ndjson.json

          if [ -s findings-ndjson.json ]; then
            aws s3 cp findings-ndjson.json "s3://${S3_BUCKET}/${S3_KEY}" \
              --content-type "application/json"
            echo "✅ Uploaded $(wc -l < findings-ndjson.json) findings to s3://${S3_BUCKET}/${S3_KEY}"
          else
            echo "ℹ️ No findings to upload"
          fi

      - name: Check for security failures
        run: |
          if [ ! -f review-report.md ]; then
            echo "❌ No review report generated — treating as failure"
            exit 1
          fi
          if grep -q "RESULT: FAIL" review-report.md; then
            echo "❌ Security review found critical or warning issues:"
            echo ""
            cat review-report.md
            exit 1
          fi
          echo "✅ Security review passed — no critical or warning issues found"
